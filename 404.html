<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — страница не найдена · LOW Launcher</title>
<meta name="description" content="Такой страницы нет. Вернитесь на главную LOW Launcher." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0e17">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Эту страницу GitHub Pages отдаёт по ЛЮБОМУ несуществующему адресу, в том числе вложенному
     (/a/b/c), поэтому все пути здесь начинаются с «/», а не относительные. -->
<link rel="icon" href="/favicon.ico?v=1" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root{
    --bg:#0b0e17; --panel:rgba(255,255,255,0.03); --panel-border:rgba(255,255,255,0.08);
    --text:#eef1fb; --dim:#96a0b7; --dim-2:#8190ad;
    --a1:#6c8cff; --a2:#a06cff; --a3:#3fd0ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{height:100%;}
  body{
    min-height:100%; display:flex; flex-direction:column;
    background:var(--bg); color:var(--text);
    font-family:'Manrope', system-ui, sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  a:focus-visible{outline:2px solid var(--a3); outline-offset:3px; border-radius:6px;}

  .bg-orb{position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0; opacity:.35;}
  .orb-1{animation:drift 20s ease-in-out infinite alternate; width:520px; height:520px; top:-180px; left:-160px; background:radial-gradient(circle, var(--a1), transparent 70%);}
  .orb-2{animation:drift-rev 24s ease-in-out infinite alternate; width:460px; height:460px; bottom:-160px; right:-140px; background:radial-gradient(circle, var(--a2), transparent 70%);}

  .wrap{max-width:1120px; width:100%; margin:0 auto; padding:0 28px; position:relative; z-index:1;}

  nav{padding:26px 0;}
  .brand{display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:16px; letter-spacing:.2px;}
  .brand-logo{width:30px; height:30px; border-radius:9px; flex-shrink:0; box-shadow:0 6px 18px rgba(108,140,255,.35);}

  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 0 72px;}
  .nf-logo{width:76px; height:76px; border-radius:22px; box-shadow:0 18px 44px rgba(108,140,255,.4); animation:float 6s ease-in-out infinite;}
  .nf-code{
    font-size:clamp(96px, 22vw, 188px); font-weight:800; line-height:1; letter-spacing:-4px; margin-top:26px;
    background:linear-gradient(90deg, var(--a1), var(--a2), var(--a1)); background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 9s linear infinite;
  }
  h1{font-size:28px; font-weight:800; margin:6px 0 12px; letter-spacing:-.3px;}
  p.lead{color:var(--dim); font-size:15.5px; max-width:460px; margin-bottom:30px;}
  .actions{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:12px 22px; border-radius:11px;
    font-size:14px; font-weight:700; border:1px solid var(--panel-border); cursor:pointer;
    transition:translate .2s ease, filter .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn:hover{translate:0 -2px;}
  .btn:active{translate:0 0;}
  .btn-primary{background:linear-gradient(135deg, var(--a1), var(--a2)); color:#fff; border:none;}
  .btn-primary:hover{filter:brightness(1.08); box-shadow:0 10px 26px rgba(108,140,255,.35);}
  .btn-ghost{background:var(--panel); color:var(--text);}
  .btn-ghost:hover{border-color:rgba(255,255,255,0.22);}

  footer{padding:24px 0 36px; font-size:13px; color:var(--dim-2); text-align:center; position:relative; z-index:1;}

  /* the whole block fades in once; the logo and the "404" keep their own looping animations */
  .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;}

  @keyframes rise{from{opacity:0; translate:0 16px;} to{opacity:1; translate:0 0;}}
  @keyframes float{0%,100%{translate:0 0;} 50%{translate:0 -10px;}}
  @keyframes shimmer{to{background-position:200% 0;}}
  @keyframes drift{to{translate:70px 50px;}}
  @keyframes drift-rev{to{translate:-60px -45px;}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="wrap">
  <nav>
    <a class="brand" href="/"><img class="brand-logo" src="/favicon.svg?v=1" alt="" width="30" height="30">LOW LAUNCHER</a>
  </nav>
</div>

<main class="wrap">
  <div class="rise" style="display:flex; flex-direction:column; align-items:center;">
    <img class="nf-logo" src="/favicon.svg?v=1" alt="" width="76" height="76">
    <div class="nf-code" aria-hidden="true">404</div>
    <h1>Такой страницы нет</h1>
    <p class="lead">Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную: там всё про лаунчер и кнопка скачивания.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">На главную</a>
      <a class="btn btn-ghost" href="/#download">Скачать лаунчер</a>
    </div>
  </div>
</main>

<footer class="wrap">© LOW Launcher</footer>

</body>
</html>
